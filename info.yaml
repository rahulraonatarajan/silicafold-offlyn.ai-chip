# Tiny Tapeout project information
# Learn more at https://tinytapeout.com

project:
  title: "SilicaFold V0 - TensorTile + PolicyGate for Offline SLM Agents"
  author: "Rahul Rao Natarajan"
  discord: ""
  description: "A Tiny Tapeout proof-of-silicon combining a folded INT4 tensor/QK primitive with a deterministic offline SLM tool-call PolicyGate."
  language: "Verilog"
  clock_hz: 25000000
  tiles: "4x2"
  top_module: "tt_um_rahulraonatarajan_silicafold_v0"

  # Source files included in order of compilation
  # Source files must be in ./src and listed separately
  source_files:
    - "sf_tensortile_core.v"
    - "sf_policygate_core.v"
    - "tt_um_rahulraonatarajan_silicafold_v0.v"

# Pinout configuration - DO NOT delete or add any pins
pinout:
  # Inputs
  ui[0]: "CMD0"
  ui[1]: "CMD1"
  ui[2]: "CMD2"
  ui[3]: "CMD3"
  ui[4]: "DIN0"
  ui[5]: "DIN1"
  ui[6]: "DIN2"
  ui[7]: "DIN3"

  # Outputs
  uo[0]: "STATUS0 (TT:busy / PG:allow)"
  uo[1]: "STATUS1 (TT:done / PG:block)"
  uo[2]: "STATUS2 (TT:overflow / PG:require_human)"
  uo[3]: "STATUS3 (TT:ctx_valid / PG:log_required)"
  uo[4]: "DOUT0"
  uo[5]: "DOUT1"
  uo[6]: "DOUT2"
  uo[7]: "DOUT3"

  # Bidirectional pins
  uio[0]: "WR_STB (input)"
  uio[1]: "RD_STB (input)"
  uio[2]: "BLOCK_SELECT (input)"
  uio[3]: "DEBUG_MODE (input)"
  uio[4]: "EXT0 (output: TT:cycle0 / PG:policy_error)"
  uio[5]: "EXT1 (output: TT:cycle1 / PG:high_risk)"
  uio[6]: "EXT2 (output: TT:cycle2 / PG:emergency_path)"
  uio[7]: "EXT3 (output: TT:cycle3 / PG:evaluated)"

# Do not change!
yaml_version: 6
