# SPDX-License-Identifier: Apache-2.0
# SilicaFold V0 - GDS Hardening Workflow
# Generates ASIC layout using Tiny Tapeout's OpenLane flow
#
# This workflow uses the official Tiny Tapeout GDS action.
# TODO: Verify the action version matches the current Tiny Tapeout shuttle.
# See: https://github.com/TinyTapeout/tt-gds-action for the latest version.
# See: https://tinytapeout.com for current shuttle information.

name: GDS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gds:
    name: Build GDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================================
      # Tiny Tapeout GDS Action
      # 
      # This action runs the complete OpenLane hardening flow:
      # - Synthesis
      # - Floorplanning
      # - Placement
      # - Clock tree synthesis
      # - Routing
      # - Signoff (DRC, LVS)
      # - GDS generation
      #
      # TODO: Update the action version to match your target shuttle.
      # Check https://github.com/TinyTapeout/tt-gds-action/releases for versions.
      # The version should correspond to your submission shuttle (e.g., tt08, tt09).
      # =====================================================================
      - name: Build GDS with Tiny Tapeout
        uses: TinyTapeout/tt-gds-action@tt09
        # Using tt09 for shuttle compatibility

      # =====================================================================
      # Artifact Upload
      # 
      # The Tiny Tapeout action produces several artifacts:
      # - GDS file (final layout)
      # - Synthesis reports
      # - Timing reports  
      # - Utilization reports
      # - DRC/LVS reports
      # - PNG/SVG renders (if enabled)
      # =====================================================================
      - name: Upload GDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gds
          path: runs/wokwi/results/final/gds/
          retention-days: 90

      - name: Upload full run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlane-run
          path: runs/
          retention-days: 30

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            runs/wokwi/reports/
            runs/wokwi/results/
          retention-days: 30

  # =========================================================================
  # Render Job (Optional)
  # Creates visual representations of the GDS
  # =========================================================================
  render:
    name: Render GDS
    needs: gds
    runs-on: ubuntu-latest
    steps:
      - name: Download GDS
        uses: actions/download-artifact@v4
        with:
          name: gds
          path: gds/

      # TODO: Add GDS rendering steps if needed
      # Options include:
      # - KLayout for SVG/PNG export
      # - GDS2WebGL for interactive HTML viewer
      # - Custom rendering scripts
      #
      # For now, the GDS file is available as an artifact.
      # Rendering can be done locally with KLayout or similar tools.

      - name: List GDS files
        run: |
          echo "=== Generated GDS Files ==="
          find gds/ -name "*.gds" -o -name "*.gds.gz" | head -20
          echo "==========================="
          echo "Download the 'gds' artifact to view the layout."
          echo "Use KLayout (https://klayout.de) to open the GDS file."
